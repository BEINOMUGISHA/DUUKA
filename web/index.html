  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "DUUKA",
    "alternateName": "DUUKA Uganda Business App",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Android, iOS, Web, Windows, macOS, Linux",
    "url": "https://beinomugisha.github.io/DUUKA/",
    "image": "https://beinomugisha.github.io/DUUKA/assets/assets/images/duka_logo.png",

    "offers": {"@type": "Offer", "price": "0", "priceCurrency": "UGX"},
    "areaServed": {"@type": "Country", "name": "Uganda"},
    "inLanguage": ["en", "lg"]
  }

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #062319;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      color: white;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top: 4px solid #34D399;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 16px auto;
    }
    .logo-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 12px;
      color: #FDE68A;
      font-weight: 600;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

  </style>

<body>
  <div id="loading" class="loading-container">
