<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DUKA - Uganda SME Finance, Stock & POS SaaS with English & Luganda support">
  <meta name="theme-color" content="#062319">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DUKA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DUKA - Uganda SME Finance & POS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #062319;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      color: white;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top: 4px solid #34D399;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 16px auto;
    }
    .logo-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 12px;
      color: #FDE68A;
      font-weight: 600;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div class="logo-text">DUKA</div>
    <div class="tagline">Uganda SME Finance & Stock</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
