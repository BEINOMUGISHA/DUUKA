name: duka
description: Uganda SME Finance & Inventory SaaS (Flutter + Riverpod + Drift + Convex)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  http: ^1.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
